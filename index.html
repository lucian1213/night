<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>밤산책 — 자동 진행</title>
<style>
  :root{
    --sky0:#060d1c; --sky1:#0c1d38; --sky2:#1b4266;
    --glass:rgba(10,22,42,.55); --line:rgba(160,190,230,.18);
    --text:#f1efe8; --dim:#93a6c4; --lamp:#f6bd62; --lamp2:#ffdf9e; --rose:#f08a6c;
  }
  *{box-sizing:border-box}
  html{height:100%;--pw:36vw;--lx:16vw;background:#04101f}
  body{height:100%;margin:0;overflow:hidden;color:var(--text);cursor:none;
    font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
    display:grid;grid-template-rows:auto 1fr auto;font-size:1.55vw;word-break:keep-all}
  .serif{font-family:"Nanum Myeongjo","Noto Serif KR","Batang","바탕",serif}

  /* 배경: 포스터 원본을 오른쪽에 그대로 배치, 왼쪽은 포스터 가장자리 색으로 이어 붙임 */
  .poster-img{position:fixed;z-index:-2;inset:0;width:100vw;height:100vh;object-fit:cover}
  body::before{content:"";position:fixed;z-index:-1;inset:0;pointer-events:none;background:
    linear-gradient(90deg,transparent 12%,rgba(3,10,24,.45) 17%,rgba(3,10,24,.4) 52%,transparent 70%),
    linear-gradient(180deg,transparent 82%,rgba(3,8,18,.6) 100%)}
  @keyframes glow{50%{opacity:.82}}

  header{display:flex;align-items:center;gap:2vw;padding:1.8vh 3vw 1.8vh var(--lx)}
  header h1{font-size:2vw;margin:0;letter-spacing:.4em;color:var(--text);font-weight:400}
  header h1::after{content:"✦";font-size:1vw;color:var(--lamp2);margin-left:-.3em;vertical-align:top}
  .acts{display:flex;gap:.6vw;flex:1;justify-content:flex-start}
  .acts span{padding:.5vh 1.3vw;border-radius:99px;border:1px solid var(--line);color:var(--dim);font-size:1.15vw}
  .acts span.done{color:rgba(147,166,196,.45);border-color:transparent}
  .acts span.cur{background:linear-gradient(180deg,var(--lamp2),var(--lamp));color:#2a1c05;border-color:transparent;
    font-weight:700;box-shadow:0 0 1.6vw rgba(246,189,98,.45)}
  .total{color:var(--dim);font-size:1.15vw;text-align:right;font-variant-numeric:tabular-nums;min-width:11vw;text-shadow:0 0 .6vw #000,0 0 .6vw #000}
  .total b{color:var(--text)}

  main{display:grid;grid-template-columns:1fr var(--pw);gap:0;padding:2vh 0 3vh var(--lx);min-height:0;align-items:center}
  .left{padding-right:3vw}
  main.wide{grid-template-columns:1fr var(--pw)}
  .left{min-width:0}
  .actlabel{color:var(--lamp);letter-spacing:.5em;font-size:1.3vw}
  .actlabel::before{content:"✦ ";color:var(--lamp2)}
  .title{font-size:4.2vw;line-height:1.15;margin:1vh 0 1.8vh;font-weight:400;text-shadow:0 0 2vw rgba(120,170,230,.35)}
  .narr{font-size:2.15vw;line-height:1.5;color:var(--lamp2);margin:0 0 2.4vh;padding-left:1.2vw;
    border-left:.25vw solid var(--lamp);text-shadow:0 0 1.5vw rgba(246,189,98,.3)}
  .who{display:flex;gap:1vw;flex-wrap:wrap;margin:0 0 2.2vh}
  .chip{padding:1vh 1.6vw;border-radius:1vw;font-size:2.3vw;font-weight:700;border:1px solid var(--line);
    background:var(--glass);backdrop-filter:blur(6px)}
  .chip small{display:block;font-size:1.05vw;font-weight:500;opacity:.85;letter-spacing:.2em}
  .chip.talk{border-color:rgba(246,189,98,.6);color:var(--lamp2);box-shadow:inset 0 0 2vw rgba(246,189,98,.12)}
  .chip.solo{border-color:rgba(140,190,240,.6);color:#b9d8f7;box-shadow:inset 0 0 2vw rgba(140,190,240,.1)}
  .body{font-size:1.75vw;line-height:1.65;color:#dfe4ee}
  .body ul{padding-left:1.2em;margin:.3em 0}
  .body li{margin:.25em 0}
  .body li::marker{color:var(--lamp)}
  .body p{margin:.5em 0}
  .body b{color:#fff}
  .body .warn{color:var(--lamp2);font-weight:700}
  .body .note{font-size:1.3vw;color:var(--dim)}
  .body .read{font-size:1.6vw;line-height:1.62;white-space:pre-line;background:var(--glass);backdrop-filter:blur(6px);
    border:1px solid var(--line);border-radius:1.2vw;padding:2vh 2.2vw}
  .piles{display:flex;gap:1vw;flex-wrap:wrap;margin:1vh 0}
  .pile{background:var(--glass);border:1px solid var(--line);border-radius:.8vw;padding:1vh 1.4vw;text-align:center}
  .pile b{display:block;color:var(--lamp2);font-size:1.8vw}
  .pile span{font-size:1.05vw;color:var(--dim)}

  .right{display:flex;flex-direction:column;align-items:center;gap:2vh;align-self:start;margin-top:3vh}
  .ring{--p:1;--c:var(--lamp);position:relative;width:min(26vw,46vh);aspect-ratio:1;display:grid;place-items:center;
    border-radius:50%;background:radial-gradient(closest-side,rgba(6,13,28,.5) 70%,transparent 100%)}
  .ring::before,.ring::after{content:"";position:absolute;inset:0;border-radius:50%;
    -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - .8vw),#000 calc(100% - .75vw));
            mask:radial-gradient(farthest-side,transparent calc(100% - .8vw),#000 calc(100% - .75vw))}
  .ring::before{background:rgba(160,190,230,.14)}
  .ring::after{background:conic-gradient(var(--c) calc(var(--p)*360deg),transparent 0);filter:drop-shadow(0 0 .6vw var(--c))}
  .ring .in{font-variant-numeric:tabular-nums;font-size:min(7vw,13vh);font-weight:300;letter-spacing:.02em;
    text-shadow:0 0 2vw rgba(246,189,98,.35)}
  .ring.low{--c:var(--rose)}
  .ring.low .in{color:var(--rose);text-shadow:0 0 2vw rgba(240,138,108,.5)}
  .ring.last .in{animation:pulse 1s infinite}
  @keyframes pulse{50%{transform:scale(1.06)}}
  .state{font-size:1.4vw;color:var(--lamp2);height:1.8vw;letter-spacing:.3em}

  footer{display:flex;align-items:center;gap:2vw;padding:1.4vh 3vw 1.8vh var(--lx);color:var(--dim);font-size:1.2vw}
  footer .next b{color:var(--text)}
  footer .sp{flex:1}
  footer .keys{opacity:.4;font-size:.9vw}

  /* 대기 화면 */
  .standby{padding-right:3vw}
  .poster{display:flex;flex-direction:column;font-size:9vw;line-height:1.05;font-weight:400;
    text-shadow:0 0 3vw rgba(150,190,240,.5)}
  .poster span:nth-child(2){margin-left:.75em;margin-top:-.15em}
  .poster span:nth-child(3){margin-left:.1em;margin-top:-.1em}
  .poster i{font-style:normal;font-size:.22em;color:var(--lamp2);vertical-align:top}
  .enter{font-size:2.6vw;margin:0 0 3vh;font-weight:400}
  .enter kbd{font:inherit;color:#2a1c05;background:linear-gradient(180deg,var(--lamp2),var(--lamp));
    border-radius:.6vw;padding:.2vh 1.2vw;box-shadow:0 0 2vw rgba(246,189,98,.5);animation:glow 2.4s ease-in-out infinite}

  .flash{animation:flash 1.1s ease-out}
  @keyframes flash{0%{opacity:0;transform:translateY(1.5vh)}100%{opacity:1;transform:none}}
</style>
</head>

안으로 들어가시겠습니까?`;

const piles = arr => '<div class="piles">' + arr.map(([n,l]) =>
  `<div class="pile"><b>${n}</b><span>${l||'조사 장소'}</span></div>`).join('') + '</div>';

// 밀담&조사 3라운드 (자리 이동 + 3분)
function rounds(act, order, cards, cardNote){
  const out = [];
  order.forEach(([a,b],i) => {
    const solo = other(a,b);
    const who = `<div class="who">
      <span class="chip talk"><small>밀담</small>${N[a]} – ${N[b]}</span>
      <span class="chip solo"><small>조사 · 카드 ${cards}장</small>${N[solo]}</span></div>`;
    out.push({act, title:`밀담 & 조사 ${i+1}/3`, sec:180, who,
      say:`${N[a]}, ${N[b]}는 밀담 장소로 이동해 주세요. ${N[solo]}는 조사를 시작합니다. 3분입니다.`,
      body:`<ul>
        <li><b>밀담</b>: 대화, 카드 공개·양도·교환 가능.</li>
        <li><b>조사</b>: ${N[solo]}는 카드 <b>${cards}장</b>을 조사합니다. ${cardNote}</li>
        <li>조사 기회는 이월할 수 없습니다. [전체 공개] 카드는 즉시 조사 장소에 오픈.</li>
      </ul>`});
    const nx = order[i+1];
    if (CFG.move) out.push({act, title:'자리 이동', sec:CFG.move,
      say: nx ? `밀담을 마친 ${N[a]}, ${N[b]}는 자리로 돌아와 주세요. 다음 밀담은 ${N[nx[0]]}, ${N[nx[1]]}입니다.`
              : `밀담을 마친 ${N[a]}, ${N[b]}는 자리로 돌아와 주세요. 곧 전체 회의를 시작합니다.`,
      who: nx ? `<div class="who"><span class="chip talk"><small>다음 밀담</small>${N[nx[0]]} – ${N[nx[1]]}</span>
        <span class="chip solo"><small>다음 조사</small>${N[other(nx[0],nx[1])]}</span></div>` : '',
      body:`<p class="note">밀담 & 조사 ${i+1}/3 종료</p>`});
  });
  return out;
}
const meeting = (act, sec) => ({act, title:'전체 회의', sec,
  say:`전체 회의를 시작합니다. ${sec/60}분입니다.`,
  body:`<p>모든 플레이어가 함께 토론합니다.</p><p class="warn">카드의 양도·교환은 불가. 전체 공개만 가능합니다.</p>`});

const STEPS = [
  /* ---------- 서막 ---------- */
  {act:'서막', title:'프롤로그', sec:CFG.prologue, wide:true,
   say:'밤산책을 시작합니다. 한 분이 대표로 프롤로그를 소리 내어 읽어 주세요.',
   body:`<div class="read serif">${PROLOGUE}</div>`},
  {act:'서막', title:'등장인물 선택', sec:CFG.pick,
   say:'등장인물을 선택해 주세요. 설정서는 아직 펼치지 않습니다.',
   who:`<div class="who"><span class="chip">타다시</span><span class="chip">마유</span><span class="chip">유이</span></div>`,
   body:`<p>설정서 표지를 확인한 후, 맡을 인물을 정하고 설정서를 가져갑니다.</p>
     <p class="warn">설정서는 아직 펼치지 마세요. 모두 같은 시점에 함께 확인합니다.</p>`},

  /* ---------- 제1막 ---------- */
  {act:'제1막', title:'1막 설정서 숙지', sec:720,
   say:'제1막입니다. 설정서를 STOP 표시까지 조용히 읽어 주세요. 12분입니다.',
   body:`<p>설정서를 <b>STOP</b>이라고 적힌 부분까지 소리 내지 않고 읽습니다.</p>
     <ul><li>설정서는 이후 언제든 다시 읽을 수 있습니다.</li>
     <li>말할 때는 설정서를 그대로 읽지 말고, 자신의 기억처럼 연기해 주세요.</li></ul>
     <p class="warn">숙지가 끝나면 자기소개 없이 바로 시작합니다.</p>`},
  ...rounds('제1막', [['t','m'],['t','y'],['m','y']], 3, '<b>1막 카드(02~11번)</b>만 조사할 수 있습니다.'),
  meeting('제1막', 300),

  /* ---------- 제2막 ---------- */
  {act:'제2막', title:'2막 설정서 숙지', sec:480,
   say:'제2막입니다. 설정서의 다음 부분을 조용히 읽어 주세요. 8분입니다.',
   body:`<p>1막 STOP 이후의 페이지를 펼쳐, 다음 STOP까지 조용히 읽습니다.</p>`},
  {act:'제2막', title:'2막 행동카드 확인', sec:CFG.actionCard,
   say:'모두 동시에, 본인의 2막 행동카드를 확인해 주세요.',
   body:`<p>모두 <span class="warn">동시에</span> 본인의 2막 행동카드를 확인합니다.</p>`},
  ...rounds('제2막', [['t','y'],['m','y'],['t','m']], 3, '1막·2막 카드를 조사할 수 있습니다.'),
  meeting('제2막', 540),

  /* ---------- 제3막 ---------- */
  {act:'제3막', title:'3막 설정서 숙지', sec:480,
   say:'제3막입니다. 설정서의 다음 부분을 조용히 읽어 주세요. 8분입니다.',
   body:`<p>2막 STOP 이후의 페이지를 펼쳐, 다음 STOP까지 조용히 읽습니다.</p>`},
  {act:'제3막', title:'스크립트 읽기', sec:CFG.script,
   say:'스크립트를 소리 내어 읽어 주세요.',
   body:`<p>스크립트를 소리 내어 읽습니다.</p>`},
  {act:'제3막', title:'3막 추가 카드 배치', sec:CFG.place3, wide:true,
   say:'3막 추가 카드를 조사 장소에 배치해 주세요.',
   body:`<p>3막 추가 카드 더미(23~37번)를 조사 장소에 배치합니다.</p>
     ${piles([['23~25'],['26~28'],['29~31'],['32~34'],['35~37']])}`},
  ...rounds('제3막', [['t','m'],['t','y'],['m','y']], 5, '배치된 모든 카드를 조사할 수 있습니다.'),
  meeting('제3막', 720),

  /* ---------- 제4막 ---------- */
  {act:'제4막', title:'4막 설정서 숙지', sec:240,
   say:'제4막입니다. 설정서의 마지막 부분을 읽고, 본인의 질문지를 확인해 주세요. 4분입니다.',
   body:`<p>3막 STOP 이후의 페이지를 펼쳐 조용히 읽습니다.</p><p>숙지한 후, 본인의 <b>질문지</b>를 가져와 확인합니다.</p>`},
  ...['t','m','y'].map(k => ({act:'제4막', title:`선택 밀담 — ${N[k]}`, sec:120,
    say:`${N[k]}의 선택 밀담 차례입니다. 원한다면 한 명을 지목해 주세요. 2분입니다.`,
    who:`<div class="who"><span class="chip talk"><small>신청 차례</small>${N[k]}</span></div>`,
    body:`<p>${N[k]}는 대화 상대 한 명을 지목해 밀담을 신청할 수 있습니다. (선택 사항)</p>
      <ul><li>신청받은 플레이어는 거절할 수 없습니다.</li><li>신청하지 않으면 그대로 대기합니다.</li></ul>`})),
  {act:'제4막', title:'질문지 작성', sec:240,
   say:'질문지를 작성해 주세요. 4분입니다.',
   body:`<p>각자 자신의 질문지를 작성합니다.</p>`},

  /* ---------- 엔딩 ---------- */
  {act:'엔딩', title:'엔딩', sec:960,
   say:'엔딩입니다. 엔딩 북을 펼쳐 안내에 따라 진행해 주세요.',
   body:`<p>엔딩 북을 펼쳐 안내에 따라 진행해 주세요.</p>`},
  {act:'엔딩', title:'수고하셨습니다', sec:0, end:true,
   say:'밤산책이 끝났습니다. 수고하셨습니다.',
   body:`<p class="serif">밤산책을 플레이해 주셔서 감사합니다.</p>`},
];
const ACTS = [...new Set(STEPS.map(s => s.act))];

/* =========================================================
   2) 엔진 — 완전 자동 진행
   ========================================================= */
const $ = s => document.querySelector(s);
let i = 0, endAt = 0, pausedLeft = null, started = false;

const STANDBY = `<div class="standby flash">
  <div>
    <p class="enter serif"><kbd>Enter</kbd> 또는 화면을 터치하면 시작합니다</p>
    <div class="body">
      <p class="note">시작 전 준비 (진행 담당)</p>
      <p><b>1막 카드</b></p>${piles([['02~05'],['06~08'],['09~11']])}
      <p><b>2막 카드</b></p>${piles([['12~15'],['16~18'],['19~21']])}
      ${piles([['특수 01~03','특수 카드'],['부록 1','평면도']])}
      <p class="note">카드 더미와 부록 1을 조사 장소에 배치 · 설정서 3부, 펜과 종이 준비<br>
      시작 후에는 엔딩까지 ${Math.round(STEPS.reduce((a,x)=>a+x.sec,0)/60)}분간 자동으로 진행됩니다.<br>비상용 키: Space 일시정지 · ←/→ 단계 이동 · ↑/↓ ±1분 · R 대기 화면</p>
    </div>
  </div></div>`;
function standby(){
  started = false; try{ history.replaceState(null,'',location.pathname+location.search); }catch(e){}
  $('#acts').innerHTML = ACTS.map(a=>`<span>${a}</span>`).join('');
  $('#total').innerHTML = ''; $('#next').innerHTML = '';
  $('#main').className = 'wide'; $('#main').innerHTML = STANDBY;
}

const fmt = s => { s=Math.max(0,Math.ceil(s)); return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0'); };
const left = () => pausedLeft != null ? pausedLeft : (endAt - Date.now())/1000;

/* 화면 꺼짐 방지 */
let wake = null;
async function keepAwake(){ try{ if(!wake && navigator.wakeLock){ wake = await navigator.wakeLock.request('screen'); wake.addEventListener('release',()=>wake=null);} }catch(e){} }
document.addEventListener('visibilitychange', () => { if (document.visibilityState==='visible') keepAwake(); });

function go(n, silent){
  started = true;
  i = Math.max(0, Math.min(STEPS.length-1, n));
  const s = STEPS[i];
  endAt = Date.now() + s.sec*1000; pausedLeft = null;
  try{ history.replaceState(null,'','#'+i); }catch(e){}
  render();
}

function render(){
  const s = STEPS[i], ai = ACTS.indexOf(s.act);
  $('#acts').innerHTML = ACTS.map((a,k)=>`<span class="${k<ai?'done':k===ai?'cur':''}">${a}</span>`).join('');
  const timer = s.end ? '' : `<div class="right"><div class="ring" id="ring"><div class="in" id="clock"></div></div><div class="state" id="state"></div></div>`;
  const m = $('#main');
  m.className = s.end ? 'wide' : '';
  m.innerHTML = `<div class="left flash">
      <div class="actlabel">${s.act}</div>
      <div class="title serif">${s.title}</div>
      ${s.say?`<p class="narr serif">${s.say}</p>`:''}
      ${s.who||''}<div class="body">${s.body||''}</div></div>${timer}`;
  // 내용이 긴 단계는 글자를 줄여 한 화면에 맞춤
  const L = m.querySelector('.left'); let f = 1;
  const room = m.clientHeight - innerHeight*.05;
  while (L.getBoundingClientRect().height > room && f > .6){ f -= .04; L.style.zoom = f; }
  const nx = STEPS[i+1];
  $('#next').innerHTML = nx ? `다음 · <b>${nx.act} ${nx.title}</b>${nx.sec?` (${nx.sec>=60?Math.round(nx.sec/60)+'분':nx.sec+'초'})`:''}` : '';
  tick();
}

function tick(){
  if (!started) return;
  const s = STEPS[i];
  if (s.end){ $('#total').innerHTML = ''; return; }
  let l = left();
  if (l <= 0 && pausedLeft == null){ return go(i+1); }
  const ring = $('#ring');
  $('#clock').textContent = fmt(l);
  ring.style.setProperty('--p', Math.min(1, Math.max(0, l/s.sec)));
  ring.classList.toggle('low', l <= Math.min(30, s.sec/4));
  ring.classList.toggle('last', l <= 10);
  $('#state').textContent = pausedLeft != null ? '일시정지' : (s.sec >= 180 && l <= 60 ? '1분 남았습니다' : '');
  const rest = l + STEPS.slice(i+1).reduce((a,x)=>a+x.sec,0);
  const end = new Date(Date.now()+rest*1000);
  $('#total').innerHTML = `남은 시간 <b>${Math.ceil(rest/60)}분</b><br>종료 예정 <b>${String(end.getHours()).padStart(2,'0')}:${String(end.getMinutes()).padStart(2,'0')}</b>`;
}
setInterval(tick, 250);
window.addEventListener('resize', () => started && render());

/* 비상용 조작 (평소에는 필요 없음) */
document.addEventListener('keydown', e => {
  if (!started){ if (e.code==='Enter' || e.code==='NumpadEnter') go(0); return; }
  if (e.code==='Space'){ e.preventDefault();
    if (pausedLeft==null) pausedLeft = left(); else { endAt = Date.now()+pausedLeft*1000; pausedLeft = null; } tick(); }
  else if (e.code==='ArrowRight') go(i+1);
  else if (e.code==='ArrowLeft') go(i-1);
  else if (e.code==='ArrowUp' || e.code==='ArrowDown'){ e.preventDefault(); const d = e.code==='ArrowUp'?60:-60;
    if (pausedLeft!=null) pausedLeft = Math.max(1,pausedLeft+d); else endAt += d*1000; tick(); }
  else if (e.code==='KeyR') standby();
});

document.addEventListener('pointerup', () => { if (!started) go(0); });

/* 시작: Enter를 누르거나 화면을 터치하면 진행. (진행 중 새로고침하면 주소의 #번호 단계부터 바로 이어감) */
keepAwake();
const h = parseInt(location.hash.slice(1));
if (h > 0 && h < STEPS.length) go(h, true); else standby();
</script>
</body>
</html>
